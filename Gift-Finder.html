<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gift-Finder · 선물 추천</title>
<meta name="description" content="받는 사람, 예산, 목적 세 가지만 고르면 어울리는 선물 3개를 추천해 드려요.">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<style>
  /* 색은 5가지만: 아이보리 · 화이트 · 로즈 · 블러시 · 웜 차콜 */
  :root {
    color-scheme: light;
    --ivory: #faf7f0;
    --white: #ffffff;
    --rose: #b97d77;
    --blush: #f5e4e1;
    --text: #3a3633;
    --muted: rgba(58, 54, 51, 0.6);
    --line: rgba(58, 54, 51, 0.12);
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0;
    background: var(--ivory);
    color: var(--text);
    font-family: "Pretendard", -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", sans-serif;
    font-size: 16px;
    line-height: 1.7;
    word-break: keep-all;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 960px; margin: 0 auto; padding: 0 20px; }

  /* ① 상단 제목 */
  header { padding: 28px 0 0; }
  .logo { font-weight: 800; color: var(--rose); letter-spacing: 0.01em; }
  .title { text-align: center; padding: 56px 0 48px; }
  .title h1 { font-size: 32px; line-height: 1.35; letter-spacing: -0.02em; margin: 0 0 10px; }
  .title p { margin: 0; color: var(--muted); }

  /* ② 조건 선택 카드 */
  .card {
    background: var(--white);
    border: 1px solid var(--line);
    border-radius: 24px;
    box-shadow: 0 6px 24px rgba(58, 54, 51, 0.04);
  }
  form.card { max-width: 680px; margin: 0 auto; padding: 32px; }
  fieldset { border: 0; margin: 0 0 28px; padding: 0; min-width: 0; }
  legend { display: flex; align-items: center; gap: 10px; font-size: 18px; font-weight: 700; margin-bottom: 14px; padding: 0; }
  legend .n {
    width: 26px; height: 26px; border-radius: 50%;
    background: var(--rose); color: var(--white);
    font-size: 13px; display: inline-flex; align-items: center; justify-content: center;
  }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip input { position: absolute; opacity: 0; pointer-events: none; }
  .chip span {
    display: inline-flex; align-items: center;
    height: 40px; padding: 0 18px;
    border-radius: 999px;
    background: var(--blush);
    cursor: pointer;
    transition: background-color .15s ease, color .15s ease, transform .1s ease;
    user-select: none;
  }
  .chip span:hover { box-shadow: inset 0 0 0 1px var(--rose); }
  .chip span:active { transform: scale(0.97); }
  .chip input:checked + span { background: var(--rose); color: var(--white); font-weight: 700; }
  .chip input:focus-visible + span { outline: 2px solid var(--rose); outline-offset: 2px; }
  .summary { border-top: 1px solid var(--line); padding-top: 18px; text-align: center; color: var(--muted); font-size: 14px; }
  .summary b { color: var(--text); }

  /* ③ 추천 버튼 */
  .btn {
    display: inline-flex; align-items: center; justify-content: center;
    border: 0; border-radius: 999px;
    font: inherit; font-weight: 700; cursor: pointer;
    transition: transform .1s ease, opacity .15s ease;
  }
  .btn:active:not(:disabled) { transform: scale(0.98); }
  .btn:focus-visible { outline: 2px solid var(--rose); outline-offset: 3px; }
  .btn-main { width: 100%; max-width: 360px; height: 56px; background: var(--rose); color: var(--white); font-size: 17px; }
  .btn-main:disabled { opacity: 0.4; cursor: not-allowed; }
  .btn-sub { height: 48px; padding: 0 22px; background: var(--white); color: var(--text); box-shadow: inset 0 0 0 1px var(--line); }
  .btn-sub:hover { box-shadow: inset 0 0 0 1px var(--rose); }
  .cta { text-align: center; margin-top: 24px; }
  .hint { margin: 10px 0 0; font-size: 14px; color: var(--muted); }

  /* ④ 추천 결과 */
  #results { padding-top: 64px; scroll-margin-top: 16px; }
  .res-title { text-align: center; margin-bottom: 8px; }
  .res-title h2 { display: inline-block; font-size: 19px; margin: 0; padding: 8px 22px; background: var(--blush); border-radius: 999px; }
  .res-note { text-align: center; color: var(--muted); font-size: 14px; margin: 10px 0 0; }
  .gifts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-top: 28px; padding: 0; list-style: none; }
  .gift { display: flex; flex-direction: column; overflow: hidden; transition: transform .2s ease; }
  .gift:hover { transform: translateY(-2px); }
  .gift .art { height: 140px; background: var(--blush); display: flex; align-items: center; justify-content: center; font-size: 56px; }
  .gift .body { padding: 22px 24px 24px; display: flex; flex-direction: column; flex: 1; }
  .gift h3 { font-size: 19px; margin: 0; line-height: 1.4; }
  .gift .price { color: var(--muted); font-size: 14px; }
  .gift p { margin: 10px 0 12px; }
  .gift .tags { color: var(--muted); font-size: 14px; margin-bottom: 18px; }
  .gift .go {
    margin-top: auto;
    display: flex; align-items: center; justify-content: center;
    height: 44px; border-radius: 999px;
    color: var(--rose); font-weight: 700; text-decoration: none;
    box-shadow: inset 0 0 0 1px var(--line);
  }
  .gift .go:hover { box-shadow: inset 0 0 0 1px var(--rose); }
  .gift .go:focus-visible { outline: 2px solid var(--rose); outline-offset: 2px; }
  .fade-up { animation: fadeUp .3s ease both; }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }

  /* ⑤ 결과 아래 버튼 */
  .actions { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin-top: 32px; }

  /* ⑥ 광고 자리: 광고를 붙일 때 hidden을 지우고 안에 넣기 */
  .ad-slot { margin-top: 48px; min-height: 90px; border: 1px dashed var(--line); border-radius: 16px; }

  /* ⑦ 하단 */
  footer { margin-top: 96px; padding: 28px 0 48px; border-top: 1px solid var(--line); color: var(--muted); font-size: 14px; }
  footer .row { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px 24px; }
  footer b { color: var(--text); }

  @media (max-width: 720px) {
    .gifts { grid-template-columns: 1fr; max-width: 420px; margin-left: auto; margin-right: auto; }
  }
  @media (max-width: 560px) {
    .title { padding: 40px 0 36px; }
    .title h1 { font-size: 26px; }
    form.card { padding: 24px; }
    .chip span { padding: 0 15px; }
  }
  @media (prefers-reduced-motion: reduce) {
    html { scroll-behavior: auto; }
    .fade-up { animation: none; }
    .gift, .gift:hover { transition: none; transform: none; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo">Gift-Finder</div>
  </header>

  <main>
    <section class="title">
      <h1>어떤 선물이 좋을까요?</h1>
      <p>세 가지만 고르면 선물 3개를 추천해 드려요</p>
    </section>

    <form id="finder" class="card" novalidate>
      <fieldset>
        <legend><span class="n">1</span>누구에게 주나요?</legend>
        <div class="chips">
          <label class="chip"><input type="radio" name="to" value="parent"><span>부모님</span></label>
          <label class="chip"><input type="radio" name="to" value="lover"><span>연인</span></label>
          <label class="chip"><input type="radio" name="to" value="friend"><span>친구</span></label>
          <label class="chip"><input type="radio" name="to" value="coworker"><span>직장 동료</span></label>
          <label class="chip"><input type="radio" name="to" value="teacher"><span>선생님</span></label>
          <label class="chip"><input type="radio" name="to" value="kid"><span>아이</span></label>
        </div>
      </fieldset>
      <fieldset>
        <legend><span class="n">2</span>예산은 얼마인가요?</legend>
        <div class="chips">
          <label class="chip"><input type="radio" name="budget" value="1"><span>1만 원 이하</span></label>
          <label class="chip"><input type="radio" name="budget" value="2"><span>1~3만 원</span></label>
          <label class="chip"><input type="radio" name="budget" value="3"><span>3~5만 원</span></label>
          <label class="chip"><input type="radio" name="budget" value="4"><span>5~10만 원</span></label>
          <label class="chip"><input type="radio" name="budget" value="5"><span>10만 원 이상</span></label>
        </div>
      </fieldset>
      <fieldset>
        <legend><span class="n">3</span>어떤 날인가요?</legend>
        <div class="chips">
          <label class="chip"><input type="radio" name="for" value="birthday"><span>생일</span></label>
          <label class="chip"><input type="radio" name="for" value="thanks"><span>감사</span></label>
          <label class="chip"><input type="radio" name="for" value="congrats"><span>축하(입학·취업)</span></label>
          <label class="chip"><input type="radio" name="for" value="anniversary"><span>기념일</span></label>
          <label class="chip"><input type="radio" name="for" value="cheer"><span>응원·위로</span></label>
          <label class="chip"><input type="radio" name="for" value="holiday"><span>명절</span></label>
        </div>
      </fieldset>
      <div class="summary" id="summary" aria-live="polite">아직 고른 조건이 없어요</div>
    </form>

    <div class="cta">
      <button type="button" class="btn btn-main" id="recommend" disabled>선물 추천받기</button>
      <p class="hint" id="hint">세 가지를 모두 고르면 버튼이 눌려요</p>
    </div>

    <section id="results" hidden aria-live="polite">
      <div class="res-title"><h2 id="resTitle"></h2></div>
      <p class="res-note" id="resNote" hidden></p>
      <ul class="gifts" id="gifts"></ul>
      <div class="actions">
        <button type="button" class="btn btn-sub" id="more">다른 선물 보기</button>
        <button type="button" class="btn btn-sub" id="reset">처음부터 다시</button>
      </div>
      <div class="ad-slot" hidden></div>
    </section>
  </main>

  <footer>
    <div class="row">
      <span><b>Gift-Finder</b> · 고민될 때 꺼내 보는 선물 추천</span>
      <span>선물 정보와 가격대는 참고용이에요. 실제 가격은 쇼핑몰에서 확인해 주세요.</span>
    </div>
  </footer>
</div>

const TO_TEXT = { parent: '부모님께', lover: '연인에게', friend: '친구에게', coworker: '직장 동료에게', teacher: '선생님께', kid: '아이에게' };
const TO_LABEL = { parent: '부모님', lover: '연인', friend: '친구', coworker: '직장 동료', teacher: '선생님', kid: '아이' };
const BUDGET_LABEL = { 1: '1만 원 이하', 2: '1~3만 원', 3: '3~5만 원', 4: '5~10만 원', 5: '10만 원 이상' };
const BUDGET_TEXT = { 1: '1만 원 이하', 2: '1~3만 원대', 3: '3~5만 원대', 4: '5~10만 원대', 5: '10만 원 이상' };
const FOR_LABEL = { birthday: '생일', thanks: '감사', congrats: '축하', anniversary: '기념일', cheer: '응원·위로', holiday: '명절' };

const form = document.getElementById('finder');
const recommendBtn = document.getElementById('recommend');
const hint = document.getElementById('hint');
const summary = document.getElementById('summary');
const results = document.getElementById('results');
const resTitle = document.getElementById('resTitle');
const resNote = document.getElementById('resNote');
const list = document.getElementById('gifts');
const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

let queue = [];
let pos = 0;
let current = null;

function getSelection() {
  const data = new FormData(form);
  const budget = data.get('budget');
  return { to: data.get('to'), b: budget ? Number(budget) : null, for: data.get('for') };
}

function update() {
  const s = getSelection();
  const picked = [s.to && TO_LABEL[s.to], s.b && BUDGET_LABEL[s.b], s.for && FOR_LABEL[s.for]].filter(Boolean);
  summary.innerHTML = picked.length ? '고른 조건 · <b>' + picked.join(' · ') + '</b>' : '아직 고른 조건이 없어요';
  const ready = picked.length === 3;
  recommendBtn.disabled = !ready;
  hint.hidden = ready;
}

function shuffle(items) {
  const a = items.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

// 추천 규칙: 모두 맞는 선물 → 목적 빼기 → 예산 한 칸 아래 → 더 낮은 예산 → 같은 예산 전체 순서로 채움
function buildQueue(s) {
  const levels = [
    g => g.to.includes(s.to) && g.b === s.b && g.for.includes(s.for),
    g => g.to.includes(s.to) && g.b === s.b,
    g => g.to.includes(s.to) && g.b === s.b - 1,
    g => g.to.includes(s.to) && g.b < s.b,
    g => g.b === s.b,
  ];
  const seen = new Set();
  const out = [];
  levels.forEach((match, level) => {
    shuffle(GIFTS.filter(g => match(g) && !seen.has(g))).forEach(g => {
      seen.add(g);
      out.push({ gift: g, level });
    });
  });
  return out;
}

function searchLink(name) {
  return 'https://search.shopping.naver.com/search/all?query=' + encodeURIComponent(name + ' 선물');
}

function render(items, wrapped) {
  list.innerHTML = '';
  items.forEach(({ gift }, i) => {
    const li = document.createElement('li');
    li.className = 'card gift fade-up';
    li.style.animationDelay = (i * 0.06) + 's';
    li.innerHTML =
      '<div class="art" aria-hidden="true"></div>' +
      '<div class="body"><h3></h3><span class="price"></span><p></p><span class="tags"></span>' +
      '<a class="go" target="_blank" rel="noopener">상품 보러 가기 →</a></div>';
    li.querySelector('.art').textContent = gift.e;
    li.querySelector('h3').textContent = gift.n;
    li.querySelector('.price').textContent = gift.p;
    li.querySelector('p').textContent = gift.r;
    li.querySelector('.tags').textContent = gift.t.map(t => '#' + t).join(' ');
    const link = li.querySelector('.go');
    link.href = gift.link || searchLink(gift.n);
    link.setAttribute('aria-label', gift.n + ' 상품 보러 가기 (새 창)');
    list.appendChild(li);
  });

  const notes = [];
  if (wrapped) notes.push('추천을 모두 봤어요. 처음부터 다시 섞어서 보여 드릴게요.');
  else if (items.some(item => item.level >= 2)) notes.push('이 예산에 맞는 선물이 적어서 조금 더 낮은 예산의 선물도 함께 골랐어요.');
  if (current.to === 'teacher') notes.push('지금 담당하시는 선생님께는 청탁금지법에 따라 선물이 제한될 수 있어요.');
  resNote.textContent = notes.join(' ');
  resNote.hidden = notes.length === 0;
}

function showNext() {
  let wrapped = false;
  if (pos + 3 > queue.length) {
    queue = buildQueue(current);
    pos = 0;
    wrapped = true;
  }
  const items = queue.slice(pos, pos + 3);
  pos += 3;
  render(items, wrapped);
}

recommendBtn.addEventListener('click', () => {
  current = getSelection();
  queue = buildQueue(current);
  pos = 0;
  resTitle.textContent = TO_TEXT[current.to] + ' 줄 ' + BUDGET_TEXT[current.b] + ' ' + FOR_LABEL[current.for] + ' 선물이에요';
  results.hidden = false;
  showNext();
  results.scrollIntoView({ behavior: reduceMotion ? 'auto' : 'smooth', block: 'start' });
});

document.getElementById('more').addEventListener('click', showNext);

document.getElementById('reset').addEventListener('click', () => {
  form.reset();
  results.hidden = true;
  list.innerHTML = '';
  current = null;
  update();
  window.scrollTo({ top: 0, behavior: reduceMotion ? 'auto' : 'smooth' });
});

form.addEventListener('change', update);
update();
</script>
